<!doctype html>
<meta charset="utf-8">
<title>Pour Decisions TV Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,600&family=Manrope:wght@600;800&display=swap">
<style>
:root{--cream:#FAF7F0;--teal:#29B7AF;--deep:#14615D;--pink:#FF6B9A;--gold:#EF8A00;--ink:#2B2B26;--muted:#6F6A5E}
html,body{margin:0;height:100%;background:#0d1b1a;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--cream);overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--ink)}
/* ambient */
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:multiply;animation:drift 22s ease-in-out infinite alternate}
.b1{width:900px;height:900px;left:-300px;top:-350px;background:#B9EDE8}
.b2{width:800px;height:800px;right:-250px;top:200px;background:#FFD7E3;animation-delay:-8s}
.b3{width:700px;height:700px;left:600px;bottom:-400px;background:#FFE7BF;animation-delay:-15s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,80px) scale(1.15)}}
.palm{position:absolute;opacity:.10;fill:#14615D;animation:sway 9s ease-in-out infinite alternate;transform-origin:bottom center}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
.fruit{position:absolute;animation:bob var(--d,7s) ease-in-out infinite alternate, spin var(--s,40s) linear infinite;filter:drop-shadow(0 14px 18px rgba(20,97,93,.18))}
@keyframes bob{from{translateY:0;transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-26px) rotate(calc(var(--r,0deg) + 6deg))}}
@keyframes spin{}
/* header */
.hdr{position:absolute;left:80px;top:48px;display:flex;align-items:center;gap:34px;opacity:0;animation:in .8s cubic-bezier(.2,1.4,.4,1) .2s forwards}
.hdr img{height:120px}
.hdr .tg{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:34px;color:var(--deep)}
.pill{position:absolute;right:80px;top:70px;display:flex;gap:14px}
.pill span{background:var(--deep);color:#fff;border-radius:999px;padding:14px 26px;font-weight:800;font-size:26px;opacity:0;animation:in .7s cubic-bezier(.2,1.4,.4,1) forwards}
.pill span:nth-child(1){animation-delay:.5s}.pill span:nth-child(2){animation-delay:.65s}
.pill b{color:#FFBE66}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}
/* category */
.cat{position:absolute;left:80px;top:215px;font-family:Fraunces,serif;font-weight:800;font-size:96px;line-height:1;color:var(--deep);letter-spacing:-.02em;opacity:0}
.cat.on{animation:catin .9s cubic-bezier(.2,1.3,.4,1) forwards}
.cat.out{animation:catout .5s ease-in forwards}
@keyframes catin{from{opacity:0;transform:translateX(-80px) skewX(-6deg)}to{opacity:1;transform:none}}
@keyframes catout{to{opacity:0;transform:translateY(-40px)}}
.note{position:absolute;left:84px;top:325px;font-size:28px;font-weight:800;color:var(--gold);opacity:0}
.note.on{animation:in .7s cubic-bezier(.2,1.4,.4,1) .35s forwards}
.note.out{animation:catout .4s ease-in forwards}
/* grid */
.grid{position:absolute;left:80px;right:80px;top:390px;bottom:60px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:26px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.card{position:relative;background:#fff;border-radius:28px;padding:22px 28px 22px 150px;box-shadow:0 18px 40px rgba(20,97,93,.12);opacity:0;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:hidden}
.card.on{animation:pop .75s cubic-bezier(.2,1.5,.4,1) forwards}
.card.out{animation:fly .45s ease-in forwards}
@keyframes pop{0%{opacity:0;transform:translateY(90px) scale(.7) rotate(-2deg)}100%{opacity:1;transform:none}}
@keyframes fly{to{opacity:0;transform:translateY(-60px) scale(.9)}}
.tile{position:absolute;left:0;top:0;bottom:0;width:120px;display:grid;place-items:center}
.tile i{width:78px;height:78px;border-radius:50%;background:var(--c);box-shadow:inset 0 -14px 0 rgba(0,0,0,.12), 0 10px 22px rgba(0,0,0,.14);transform:scale(0)}
.card.on .tile i{animation:popin .6s cubic-bezier(.2,1.6,.4,1) .25s forwards}
@keyframes popin{to{transform:scale(1)}}
.nm{font-family:Fraunces,serif;font-weight:800;font-size:40px;line-height:1;color:var(--ink)}
.ing{font-size:21px;color:var(--muted);font-weight:600;line-height:1.3}
.tag{display:inline-block;white-space:nowrap;align-self:flex-start;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--deep);background:#E4F6F4;border-radius:999px;padding:5px 12px}
.prices{display:flex;gap:10px;margin-top:4px}.pr{white-space:nowrap;background:var(--gold);color:#fff;font-weight:800;font-size:24px;padding:8px 14px;border-radius:14px;line-height:1;display:flex;align-items:baseline;gap:6px;transform:scale(0);transform-origin:left center}
.card.on .pr{animation:tag .6s cubic-bezier(.2,1.5,.4,1) .4s forwards}
@keyframes tag{to{transform:scale(1)}}
.pr small{font-size:14px;opacity:.9}.pr2{background:var(--deep)}
/* footer strip */
.strip{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--deep);color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;gap:40px;overflow:hidden;opacity:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <svg class="palm" style="left:-120px;bottom:-40px;width:620px;height:620px" viewBox="0 0 200 200"><path d="M100 200 L104 120 C60 110 25 130 5 160 C30 120 65 100 104 110 C70 80 45 60 20 30 C55 55 85 80 106 104 C100 60 110 30 130 5 C118 40 112 70 112 104 C140 80 170 75 195 80 C160 85 135 95 116 110 C150 115 175 135 195 165 C170 140 140 125 112 122 L108 200Z"/></svg>
  <svg class="palm" style="right:-140px;top:-60px;width:560px;height:560px;transform:scaleX(-1)" viewBox="0 0 200 200"><path d="M100 200 L104 120 C60 110 25 130 5 160 C30 120 65 100 104 110 C70 80 45 60 20 30 C55 55 85 80 106 104 C100 60 110 30 130 5 C118 40 112 70 112 104 C140 80 170 75 195 80 C160 85 135 95 116 110 C150 115 175 135 195 165 C170 140 140 125 112 122 L108 200Z"/></svg>
  <!-- fruit -->
  <svg class="fruit" style="left:1690px;top:190px;width:150px;--d:6s;--r:-12deg" viewBox="0 0 100 100"><path d="M50 92 C25 80 12 58 14 40 C16 26 30 20 42 26 L50 32 L58 26 C70 20 84 26 86 40 C88 58 75 80 50 92Z" fill="#E8365D"/><g fill="#FFE29A"><circle cx="36" cy="46" r="2.4"/><circle cx="50" cy="40" r="2.4"/><circle cx="64" cy="46" r="2.4"/><circle cx="42" cy="60" r="2.4"/><circle cx="58" cy="60" r="2.4"/><circle cx="50" cy="74" r="2.4"/></g><path d="M50 30 C42 18 30 18 26 22 C36 22 44 26 50 30 C56 26 64 22 74 22 C70 18 58 18 50 30Z" fill="#2E9C5C"/></svg>
  <svg class="fruit" style="left:1700px;top:560px;width:130px;--d:8s;--r:10deg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#F7C948"/><circle cx="50" cy="50" r="36" fill="#FFF3B0"/><g stroke="#F7C948" stroke-width="3"><line x1="50" y1="14" x2="50" y2="86"/><line x1="14" y1="50" x2="86" y2="50"/><line x1="24" y1="24" x2="76" y2="76"/><line x1="76" y1="24" x2="24" y2="76"/></g></svg>
  <svg class="fruit" style="left:60px;top:880px;width:120px;--d:7s;--r:20deg" viewBox="0 0 100 100"><path d="M20 30 C40 10 70 14 84 36 C70 34 46 40 30 60 C22 52 16 40 20 30Z" fill="#3FB56B"/><path d="M22 32 C48 34 66 44 82 38" stroke="#2E8A50" stroke-width="3" fill="none"/></svg>
  <svg class="fruit" style="left:1520px;top:230px;width:100px;--d:9s;--r:-6deg" viewBox="0 0 100 100"><g fill="#5A5FBF"><circle cx="34" cy="60" r="18"/><circle cx="62" cy="56" r="18"/><circle cx="48" cy="34" r="18"/></g><g fill="#3E43A0"><circle cx="34" cy="60" r="4"/><circle cx="62" cy="56" r="4"/><circle cx="48" cy="34" r="4"/></g></svg>
  <svg class="fruit" style="left:1800px;top:60px;width:150px;--d:10s;--r:14deg" viewBox="0 0 100 100"><ellipse cx="50" cy="64" rx="26" ry="32" fill="#F4B942"/><path d="M28 64 L72 64 M32 50 L68 50 M32 78 L68 78 M40 34 L60 96 M60 34 L40 96" stroke="#C98A1B" stroke-width="2.5"/><path d="M50 34 C38 22 44 10 50 4 C56 10 62 22 50 34Z M50 34 C34 26 26 14 30 6 C40 10 48 20 50 34Z M50 34 C66 26 74 14 70 6 C60 10 52 20 50 34Z" fill="#2E9C5C"/></svg>
  <div class="hdr"><img src="LOGO" alt="Pour Decisions"><div class="tg">Pick your pour.</div></div>
  <div class="pill"><span>16 oz <b>$9.50</b></span><span>24 oz <b>$12.50</b></span></div>
  <div class="cat" id="cat"></div>
  <div class="note" id="note"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const MENU = MENUJSON;
const COLORS = {'the-regular':'#F25C7A','happy-hour':'#FF9A3C','green-light':'#4CB96B','nightcap':'#6B4FBB','designated-driver':'#FFE08A','last-call':'#FF4FA3','liquid-courage':'#8B5A2B','open-tab':'#B8336A','morning-shift':'#5C4033','heavy-pour':'#7A4A1E','early-bird':'#F47C8C','green-room':'#3E9E5E','carrot-cake':'#F28C28'};
const money=n=>'$'+(Number.isInteger(n)?n:n.toFixed(2));
const cats = MENU.categories.filter(c=>['smoothies','protein-oats'].includes(c.key));
const $=s=>document.querySelector(s);
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
function card(it,i){
  const sz=MENU.sizes[it.size]||[]; const base=sz[0]?money(sz[0].price):''; const big=sz[1]?money(sz[1].price):'';
  return `<div class="card" style="animation-delay:${i*.13}s"><div class="tile"><i style="--c:${COLORS[it.id]||'#29B7AF'}"></i></div>
  <div class="nm">${it.name}</div><div class="ing">${it.ingredients.join(' · ')}</div><div class="prices"><div class="pr" style="animation-delay:${.4+i*.13}s">${base}<small>16 oz</small></div><div class="pr pr2" style="animation-delay:${.5+i*.13}s">${big}<small>24 oz</small></div>${it.tag?`<span class="tag" style="align-self:center;margin-left:auto">${it.tag}</span>`:''}</div></div>`;
}
let idx=0;
function show(){
  const c=cats[idx]; const cat=$('#cat'),note=$('#note'),grid=$('#grid');
  cat.className='cat';note.className='note';void cat.offsetWidth;
  cat.textContent=c.title; note.textContent=c.note.split(' · make')[0]; cat.classList.add('on'); note.classList.add('on');
  grid.className='grid'+(c.items.length<=4?' two':''); grid.innerHTML=c.items.map(card).join('');
  requestAnimationFrame(()=>grid.querySelectorAll('.card').forEach(el=>el.classList.add('on')));
  const hold = 4000 + c.items.length*130 + 14000;
  setTimeout(()=>{ cat.classList.add('out'); note.classList.add('out'); grid.querySelectorAll('.card').forEach((el,i)=>{el.style.animationDelay=(i*.04)+'s'; el.classList.add('out')});
    setTimeout(()=>{ idx=(idx+1)%cats.length; show(); }, 700); }, hold);
}
setTimeout(show, 900);
</script>
