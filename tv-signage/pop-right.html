<!doctype html>
<meta charset="utf-8">
<title>Pour Decisions TV Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,600&family=Manrope:wght@600;800&display=swap">
<style>
:root{--cream:#FAF7F0;--teal:#29B7AF;--deep:#14615D;--gold:#EF8A00;--ink:#2B2B26;--muted:#6F6A5E}
html,body{margin:0;height:100%;background:#0d1b1a;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--cream);overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--ink)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:multiply;animation:drift 24s ease-in-out infinite alternate}
.b1{width:900px;height:900px;left:-300px;top:-350px;background:#B9EDE8}
.b2{width:800px;height:800px;right:-250px;top:200px;background:#FFD7E3;animation-delay:-8s}
.b3{width:700px;height:700px;left:600px;bottom:-400px;background:#FFE7BF;animation-delay:-15s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,80px) scale(1.15)}}
.palm{position:absolute;opacity:.09;fill:#14615D;animation:sway 9s ease-in-out infinite alternate;transform-origin:bottom center}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
.fruit{position:absolute;animation:bob var(--d,7s) ease-in-out infinite alternate;filter:drop-shadow(0 14px 18px rgba(20,97,93,.18))}
@keyframes bob{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-26px) rotate(calc(var(--r,0deg) + 6deg))}}
/* header */
.hdr{position:absolute;left:70px;top:18px;display:flex;align-items:center;gap:30px;opacity:0;animation:in .8s cubic-bezier(.2,1.4,.4,1) .2s forwards}
.hdr img{height:140px;filter:drop-shadow(0 10px 18px rgba(20,97,93,.18))}
.hdr .qr{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:10px 18px 10px 10px;box-shadow:0 10px 24px rgba(20,97,93,.14)}.hdr .qr svg{width:104px;height:104px;display:block}.hdr .qr div{font-family:Manrope,sans-serif;font-weight:800;font-size:20px;line-height:1.15;color:var(--deep)}.hdr .qr small{display:block;font-weight:700;font-size:15px;color:var(--gold)}
.hdr .tg{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:32px;color:var(--deep)}
.pill{position:absolute;right:70px;top:50px;display:flex;gap:12px}
.pill span{background:var(--deep);color:#fff;border-radius:999px;padding:13px 24px;font-weight:800;font-size:27px;opacity:0;animation:in .7s cubic-bezier(.2,1.4,.4,1) .3s forwards}
.pill b{color:#FFBE66}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}
/* screen = one or two sections, always complete */
.screen{position:absolute;left:70px;right:70px;top:160px;bottom:96px;display:grid;gap:0 44px;opacity:0}
.screen.on{animation:scin .6s cubic-bezier(.2,1.2,.4,1) forwards}
.screen.out{animation:scout .45s ease-in forwards}
@keyframes scin{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes scout{to{opacity:0;transform:translateY(-30px)}}
.sec{display:flex;flex-direction:column;min-height:0;min-width:0}
.sech{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.cat{font-family:Fraunces,serif;font-weight:800;font-size:56px;line-height:1;color:var(--deep);letter-spacing:-.02em;white-space:nowrap}
.note{font-size:22px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;align-content:start;min-width:0}
.list.one{grid-template-columns:1fr}
.row{min-width:0;position:relative;background:#fff;border-radius:22px;padding:10px 16px 10px 104px;box-shadow:0 10px 26px rgba(20,97,93,.10);opacity:0;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:84px;transition:transform .5s cubic-bezier(.2,1.3,.4,1),box-shadow .5s,background .5s}
.row.on{animation:pop .6s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translateY(40px) scale(.85)}100%{opacity:1;transform:none}}
.row.spot{transform:scale(1.04);box-shadow:0 22px 46px rgba(20,97,93,.22);background:#FFFDF7;z-index:2}
.tile{position:absolute;left:10px;top:0;bottom:0;width:88px;display:grid;place-items:center}
.tile svg{width:72px;height:72px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.14));transition:transform .5s cubic-bezier(.2,1.5,.4,1)}
.row.spot .tile svg{transform:scale(1.28) rotate(-6deg)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nm{font-family:Fraunces,serif;font-weight:800;font-size:34px;line-height:1;color:var(--ink);white-space:nowrap}
.ing{font-size:21px;color:var(--muted);font-weight:600;line-height:1.25;white-space:normal}
.row.spot .ing{white-space:normal}
.prices{display:flex;gap:8px;margin-left:auto;align-items:center}
.pr{white-space:nowrap;background:var(--gold);color:#fff;font-weight:800;font-size:21px;padding:6px 10px;border-radius:12px;line-height:1;display:flex;align-items:center;gap:6px}
.pr small{font-size:13px;opacity:.9}.pr svg{width:26px;height:26px}
.pr2{background:var(--deep)}
/* compact strip for shots / packs */
.strip{display:flex;gap:16px;margin-top:14px}
.box{flex:1;background:#fff;border-radius:22px;padding:12px 18px;box-shadow:0 10px 26px rgba(20,97,93,.10);opacity:0}
.box.on{animation:pop .6s cubic-bezier(.2,1.5,.4,1) forwards}
.box h4{margin:0 0 6px;font-family:Fraunces,serif;font-weight:800;font-size:34px;color:var(--deep);line-height:1}
.box h4 small{font-family:Manrope;font-size:20px;color:var(--gold);margin-left:12px}
.box .ln{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;padding:3px 0;color:var(--ink);white-space:nowrap}
.box .ln svg{width:34px;height:34px;flex:0 0 34px}
.box .ln span{color:var(--muted);font-weight:600;font-size:17px;white-space:normal;min-width:0}
.box .ln b{margin-left:auto;color:var(--gold);white-space:nowrap}
/* ticker + progress */
.ticker{position:absolute;left:0;right:0;bottom:0;height:70px;background:var(--deep);color:#fff;display:flex;align-items:center;padding:0 70px;font-size:28px;font-weight:800;overflow:hidden}
.ticker .msg{position:absolute;left:70px;right:260px;opacity:0;animation:tick 8s ease-in-out infinite}
.ticker .msg b{color:#FFBE66}
@keyframes tick{0%{opacity:0;transform:translateY(20px)}8%{opacity:1;transform:none}88%{opacity:1;transform:none}96%{opacity:0;transform:translateY(-20px)}100%{opacity:0}}
.prog{position:absolute;right:70px;bottom:26px;width:160px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#FFBE66}
.dots{position:absolute;right:70px;bottom:44px;display:flex;gap:8px;font-size:18px;color:rgba(255,255,255,.7);font-weight:800}
.screen.food .note{display:none}.screen.food .cat{font-size:50px}.screen.food .nm{font-size:27px}.screen.food .ing{font-size:18px}.screen.food .pr{font-size:18px;padding:5px 9px}.screen.food .pr small{font-size:12px}.screen.food .pr svg{width:22px;height:22px}.screen.food .row{min-height:70px;padding:8px 12px 8px 92px;gap:2px}.screen.food .tile{width:80px}.screen.food .tile svg{width:62px;height:62px}.screen.food .list{gap:7px 14px}.screen.food .top{gap:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

 pack:()=>`<svg viewBox="0 0 100 100"><g fill="#EAF6F5"><rect x="14" y="30" width="20" height="56" rx="5"/><rect x="40" y="30" width="20" height="56" rx="5"/><rect x="66" y="30" width="20" height="56" rx="5"/></g><g><rect x="16" y="48" width="16" height="36" rx="4" fill="#5CB85C"/><rect x="42" y="48" width="16" height="36" rx="4" fill="#F28C28"/><rect x="68" y="48" width="16" height="36" rx="4" fill="#C2185B"/></g></svg>`
};
const KIND={'smoothies':'smoothie','protein-oats':'smoothie','juices':'juice','shots':'shot','salads':'salad'};
const FOODICON={'ballistic-shrimp-burrito':'burrito','pesto-panini':'panini','chipotle-panini':'panini','veggie-panini':'panini','acai-bowl':'bowl','fruit-bowl':'bowl','oatmeal':'bowl','overnight-oats':'bowl','soup':'soup','avocado-toast':'toast'};
const PROT={chicken:'chicken',salmon:'salmon',tuna:'tuna',shrimp:'salmon'};
const cat=k=>MENU.categories.find(c=>c.key===k);
function icon(c,it){ const k = FOODICON[it.id] || KIND[c.key] || (c.key==='wraps-paninis'?'wrap':'bowl'); return I[k](COLORS[it.id]||'#29B7AF'); }
function chip(label,price,j,prot){ const ic=prot&&PROT[prot]?I[PROT[prot]]():''; return `<div class="pr ${j%2?'pr2':''}">${ic}${money(price)}${label?`<small>${label}</small>`:''}</div>`; }
function row(c,it,i){
  const sz=MENU.sizes[it.size]||[]; let chips='';
  if(sz.length){ const std=MENU.sizes[c.key==='smoothies'?'smoothie':c.key==='protein-oats'?'meal':c.key==='juices'?'juice':'shot']; chips = (it.size==='smoothie_protein')? `<div class="pr">+$1</div>` : (std && std[0].price!==sz[0].price ? sz.map((z,k)=>chip(z.oz+' oz',z.price,k)).join('') : ''); }
  else if(it.prices) chips=Object.entries(it.prices).map(([k,v],j)=>chip(k,v,j,k)).join('');
  else if(it.price!=null) chips=chip('',it.price,0);
  const extra=it.addons?' · '+it.addons.map(a=>`+${a.name} ${money(a.price)}`).join(' · '):'';
  return `<div class="row" style="animation-delay:${i*.06}s"><div class="tile">${icon(c,it)}</div><div class="top"><div class="nm">${it.name}</div><div class="prices">${chips}</div></div><div class="ing">${it.ingredients.join(' · ')}${extra}</div></div>`;
}
function section(key,opts={}){
  const c=cat(key); if(!c) return '';
  const note=(c.note||'').split(' · make')[0];
  return `<div class="sec"><div class="sech"><div class="cat">${c.title}</div><div class="note">${note}</div></div><div class="list ${opts.one?'one':''}">${c.items.map((it,i)=>row(c,it,i)).join('')}</div>${opts.after||''}</div>`;
}
function shotsBox(){ const c=cat('shots'); return `<div class="box"><h4>${c.title}<small>${c.note}</small></h4>${c.items.map(it=>`<div class="ln">${I.shot(COLORS[it.id])}${it.name}<span>${it.ingredients.join(', ')}</span><b>${money(MENU.sizes.shot[0].price)}</b></div>`).join('')}</div>`; }
function packsBox(){ const p=MENU.packages; return `<div class="box"><h4>${p.title}<small>mix &amp; match</small></h4>${p.items.map(it=>`<div class="ln">${I.pack()}${it.name}<span>${it.desc}</span><b>${money(it.price)}</b></div>`).join('')}</div>`; }
const BOARDS={
 left:{tag:'Pick your pour.',pills:'smoothie',screens:[{cols:'2fr 1fr',html:()=>section('smoothies')+section('protein-oats',{one:true})}],
   ticker:['Ask about our <b>daily specials</b>','<b>Build your own</b> — pick up to 4, same price as the menu','Make any smoothie a meal — oats + protein <b>+$3</b>','Add-ins from <b>+$1</b> · protein · sea moss · collagen · espresso']},
 right:{tag:'Pressed fresh daily.',pills:'juice',screens:[
   {cols:'1.5fr 1fr',html:()=>section('juices')+`<div class="sec"><div class="strip" style="flex-direction:column;margin-top:0">${shotsBox()}${packsBox()}</div></div>`,pills:'juice'},
   {cols:'1fr 1fr 1fr',html:()=>section('salads',{one:true})+section('wraps-paninis',{one:true})+section('bowls-breakfast',{one:true}),pills:'food',tag:'Good food, fast.'}],
   ticker:['Add a wellness shot to any juice <b>+$3</b>','Ask about our <b>daily specials</b>','Add protein to any salad or wrap — chicken <b>+$5</b> · tuna <b>+$4</b> · salmon <b>+$7</b>','Any wrap or panini + 16 oz smoothie <b>$17</b>']},
 food:{tag:'Good food, fast.',pills:'food',screens:[{cols:'1fr 1fr 1fr',html:()=>section('salads',{one:true})+section('wraps-paninis',{one:true})+section('bowls-breakfast',{one:true})}],
   ticker:['Ask about our <b>daily specials</b>','Add protein — chicken <b>+$5</b> · tuna <b>+$4</b> · salmon <b>+$7</b>','Any wrap or panini + 16 oz smoothie <b>$17</b>']}
};
const cfg=BOARDS[BOARD]||BOARDS.left;
// soft opening: drinks only
cfg.screens = cfg.screens.filter(s => (s.pills||cfg.pills) !== 'food');
cfg.ticker = ['<b>Food menu coming soon</b> — drinks only during our soft opening'].concat(cfg.ticker.filter(t => !/protein to any salad|wrap or panini/i.test(t)));
const HOLD=20000;
const $=s=>document.querySelector(s);
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
function pills(kind){ const p=$('#pill'); if(kind==='food'){ p.innerHTML='<span>Add protein <b>+$4–7</b></span>'; return; } const z=MENU.sizes[kind]; p.innerHTML=z.map(s=>`<span>${s.oz} oz <b>${money(s.price)}</b></span>`).join('') + '<span style="background:#EF8A00">Food menu · <b>coming soon</b></span>'; }
let si=0, spotTimer, spotIdx=0;
function spotlight(root){ clearInterval(spotTimer); const rows=[...root.querySelectorAll('.row')]; spotIdx=0;
  spotTimer=setInterval(()=>{ rows.forEach(r=>r.classList.remove('spot')); if(rows.length){ rows[spotIdx%rows.length].classList.add('spot'); spotIdx++; } }, 4000); }
function show(){
  const sc=cfg.screens[si]; const host=$('#screens');
  const el=document.createElement('div'); el.className='screen'+((sc.pills||cfg.pills)==='food'?' food':''); el.style.gridTemplateColumns=sc.cols; el.innerHTML=sc.html(); host.appendChild(el);
  $('#tg').textContent=sc.tag||cfg.tag; pills(sc.pills||cfg.pills);
  requestAnimationFrame(()=>{ el.classList.add('on'); el.querySelectorAll('.row,.box').forEach((r,i)=>{ r.style.animationDelay=(i*.05)+'s'; r.classList.add('on'); }); });
  setTimeout(()=>spotlight(el), 1500);
  const multi=cfg.screens.length>1; $('#dots').textContent = multi? `${si+1} / ${cfg.screens.length}` : '';
  const bar=$('#bar'); bar.style.transition='none'; bar.style.width='0'; if(multi) requestAnimationFrame(()=>{ bar.style.transition=`width ${HOLD}ms linear`; bar.style.width='100%'; });
  if(multi) setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>{ el.remove(); si=(si+1)%cfg.screens.length; show(); }, 450); }, HOLD);
}
// ticker
(function(){ const t=$('#tk'); let i=0; const put=()=>{ t.innerHTML=`<div class="msg">${cfg.ticker[i%cfg.ticker.length]}</div>`; i++; }; put(); setInterval(put,8000); })();
setTimeout(show, 700);
</script>
